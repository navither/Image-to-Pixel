<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>🎨 Image-to-Pixel</title>
  <!-- Include Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Google Fonts for Modern Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/logo.css">
  <link rel="stylesheet" type="text/css" href="css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css" />
  <link rel="stylesheet" type="text/css" href="css/picker.css">
  <!-- JSZip for batch download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--color-hover) var(--color-primary)
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px
    }

    ::-webkit-scrollbar-track {
      background: var(--color-primary)
    }

    ::-webkit-scrollbar-thumb {
      background-color: var(--color-hover);
      border-radius: 4px;
      border: 2px solid var(--color-primary)
    }

    .setting-group {
      position: relative;
    }

    .toggle-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 30px !important;
      height: 17px !important;
      background-color: var(--color-background) !important;
      border: none;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      transition: background-color 0.3s;
      padding: 9px 16px !important;
    }

    .toggle-btn.active {
      background-color: var(--color-accent) !important;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 2px;
      width: 12px;
      height: 12px;
      background-color: var(--color-text);
      border-radius: 50%;
      transition: 0.3s;
      pointer-events: none;
      margin: 0 !important;
      padding: 0px !important;
    }

    .toggle-btn.active .toggle-thumb {
      left: 16px;
      background-color: white;
    }

    #paletteSelector {
      display: none;
    }

    /* Animation keyframes */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(100%); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Image list panel styles */
    .image-list-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--color-secondary);
      border-top: 1px solid var(--color-border);
      max-height: 150px;
      display: none;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .image-list-panel.active {
      display: flex;
      animation: slideUp 0.3s ease forwards;
    }

    .image-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background-color: var(--color-primary);
      border-bottom: 1px solid var(--color-border);
    }

    .image-list-header span {
      font-size: 0.9rem;
      color: var(--color-text);
      padding: 0;
    }

    .image-list-actions {
      display: flex;
      gap: 8px;
    }

    .image-list-actions button {
      padding: 6px 12px !important;
      font-size: 0.85rem !important;
      margin: 0 !important;
      border-radius: 20px !important;
      background-color: var(--color-accent) !important;
      color: white !important;
      border: none !important;
      cursor: pointer !important;
      transition: all 0.3s ease !important;
      display: flex !important;
      align-items: center !important;
      gap: 5px !important;
    }

    .image-list-actions button:hover {
      background-color: var(--color-accent2) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 4px 12px rgba(88, 141, 255, 0.4) !important;
    }

    .image-list-actions button:active {
      transform: translateY(0) scale(0.95) !important;
    }

    .image-list-actions button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .image-list {
      display: flex;
      gap: 10px;
      padding: 10px;
      overflow-x: auto;
      flex: 1;
    }

    .image-item {
      position: relative;
      flex-shrink: 0;
      width: 100px;
      height: 100px;
      border: 2px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: scaleIn 0.3s ease backwards;
    }

    .image-item:hover {
      border-color: var(--color-accent);
      transform: scale(1.08) translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .image-item.active {
      border-color: var(--color-accent);
      box-shadow: 0 0 15px rgba(88, 141, 255, 0.6), inset 0 0 20px rgba(88, 141, 255, 0.1);
      animation: bounce 0.5s ease;
    }

    .image-item.processed {
      border-color: #4CAF50;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.4);
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-item .remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(255, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      padding: 0 !important;
      margin: 0 !important;
    }

    .image-item:hover .remove-btn {
      opacity: 1;
    }

    .image-item .status-icon {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-item .status-icon.processed {
      background: rgba(76, 175, 80, 0.9);
    }

    .image-item .status-icon.processing {
      background: rgba(255, 193, 7, 0.9);
      animation: pulse 1s infinite, spin 1s linear infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .image-item .image-name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 10px;
      padding: 2px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .canvas-wrapper.with-panel {
      height: calc(100% - 150px);
    }

    /* Canvas animation */
    #canvas {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #canvas.updating {
      opacity: 0.5;
      transform: scale(0.98);
    }

    /* Progress indicator for batch operations */
    .progress-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .progress-content {
      background: var(--color-secondary);
      padding: 30px 50px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      min-width: 400px;
    }

    .progress-content h3 {
      color: var(--color-text);
      margin-bottom: 20px;
      font-size: 1.3rem;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: var(--color-text-secondary);
      font-size: 0.85rem;
    }

    .progress-current-file {
      color: var(--color-accent);
      margin-bottom: 15px;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 350px;
      margin-left: auto;
      margin-right: auto;
    }

    .progress-bar {
      width: 350px;
      height: 10px;
      background: var(--color-border);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-accent), var(--color-accent2));
      border-radius: 5px;
      transition: width 0.3s ease;
      background-size: 200% 100%;
      animation: shimmer 2s linear infinite;
      position: relative;
    }

    .progress-percentage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      color: var(--color-text-secondary);
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .progress-stats span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .progress-text {
      color: var(--color-text-secondary);
      font-size: 0.9rem;
    }

    /* Button ripple effect */
    .ripple {
      position: relative;
      overflow: hidden;
    }

    .ripple::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s;
    }

    .ripple:active::after {
      width: 200px;
      height: 200px;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 180px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--color-accent);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1001;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      background: #4CAF50;
    }

    .toast.error {
      background: #f44336;
    }
  </style>
</head>

<body>
  <header>
    <div id="logo-container" aria-label="Image-to-Pixel Logo">
    </div>
    <div class="download-buttons">
      <button id="downloadFull" title="Download Full Resolution">
                <i class="fas fa-download"></i>
            </button>
      <button id="downloadPixel" title="Download Pixelated Image">
                <i class="fas fa-file-image"></i>
            </button>
    </div>
  </header>
  <div class="container">
    <div class="tool-panel">
      <button id="pixelateButton">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Pixelate
            </button>
      <button title="auto refresh" id="autoPixelateToggle" class="toggle-btn" aria-pressed="false">
                <span class="toggle-thumb"></span>
            </button>
      <div class="settings">
        <div class="setting-group">
          <label for="pixel-data">
                        <i class="fa-solid fa-chevron-down"></i>
                        Pixel Width</label>
          <div id="pixel-data" class="input-group">
            <select id="pixelWidthSelector">
                            <option value="16">16</option>
                            <option value="32">32</option>
                            <option value="64">64</option>
                            <option value="128" selected>128</option>
                            <option value="256">256</option>
                        </select>
            <div class="span-group">
              <span>Custom:</span>
              <input type="text" id="pixelWidthInput" value="128">
              <button id="autoDetectButton" title="Auto Detect Image Width">Auto Detect</button>
            </div>
          </div>
        </div>
        <div class="setting-group">
          <label for="dither-data">
                        <i class="fa-solid fa-chevron-down"></i>
                        Dither Type</label>
          <div id="dither-data" class="input-group">
            <select id="dithering">
                            <option value="none">None</option>
                            <option value="atkinson">Atkinson</option>
                            <option value="Floyd-Steinberg">Floyd-Steinberg</option>
                            <option value="2x2 Bayer">2x2 Bayer</option>
                            <option value="4x4 Bayer" selected>4x4 Bayer</option>
                            <option value="ordered">Ordered 8x8</option>
                            <option value="Clustered 4x4">Clustered 4x4</option>
                        </select>
            <div class="slider-container">
              <span>Strength</span>
              <input type="range" id="ditheringStrength" min="0" max="100" value="10">
            </div>
          </div>
        </div>
        <div class="setting-group">
          <label for="main-container">
                        <i class="fa-solid fa-chevron-down"></i>
                        Palette</label>
          <button id="palette-toggle" class="toggle-btn active" aria-pressed="true">
                        <span class="toggle-thumb"></span>
                    </button>
          <div id="main-container" class="main-container">
            <div class="palette-switcher">
              <div class="palette-list-wrapper">
                <h4>Default</h4>
                <select id="default-palette-selector"></select>
              </div>
              <div class="palette-list-wrapper">
                <h4>Custom</h4>
                <select id="custom-palette-selector">
                                    <option value="none">None</option>
                                </select>
              </div>
            </div>
            <input type="text" id="palette-name-input" placeholder="Enter palette name" />
            <div class="color-list">
              <div id="selected-colors"></div>
            </div>
            <div class="controls">
              <button id="add-color-button">Add Color</button>
              <button id="save-palette-button" class="save-button">Save</button>
              <button id="delete-palette-button" class="delete-button">Delete</button>
            </div>
            <button id="upload-palette-button">Upload Palette</button>
            <button id="download-palette-button">Download Palette</button>
            <input type="file" id="palette-file-input" style="display:none" accept=".json">
            <div id="hidden-picker"></div>
          </div>
        </div>
        <div title="the slug is the last part of the lospec URL-EX: https://lospec.com/palette-list/rgbg-36"
          class="setting-group">
          <button id="lospec-toggle" class="toggle-btn" aria-pressed="false">
                        <span class="toggle-thumb"></span>
                    </button>
          </button>
          <label for="palette-input">
                        <i class="fa-solid fa-chevron-down"></i>
                        Lospec Palette</label>
          <div id="palette-input" class="input-group">

            <select id="paletteSelector">
                            <option value="rgbg-36" selected>rgbg-36</option>
                        </select>
            <div class="span-group">
              <span>Slug:</span>
              <input type="text" id="paletteInput" value="rgbg-36">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="main-content">
      <div id="dropzone">
        <p>Drop images or click to upload (supports multiple)</p>
      </div>
      <div class="canvas-wrapper">
        <canvas id="canvas"></canvas>
      </div>
      <input type="file" id="fileInput" style="display:none" accept="image/*" multiple>
      <!-- Image list panel -->
      <div id="imageListPanel" class="image-list-panel">
        <div class="image-list-header">
          <span>Images (<span id="imageCount">0</span>)</span>
          <div class="image-list-actions">
            <button id="processAllBtn" title="Process All Images"><i class="fas fa-play"></i></button>
            <button id="downloadAllBtn" title="Download All"><i class="fas fa-download"></i></button>
            <button id="clearAllBtn" title="Clear All"><i class="fas fa-trash"></i></button>
          </div>
        </div>
        <div id="imageList" class="image-list"></div>
      </div>
    </div>
  </div>
  <script src="src/logo.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
  <script src="src/picker.js"></script>
  <script src="image-to-pixel.js"></script>
  <script>
    document.querySelectorAll('label[for]').forEach(label => {
            label.onclick = () => {
                const targetId = label.getAttribute('for');
                const targetElement = document.getElementById(targetId);
                const chevron = label.querySelector('.fa-chevron-down, .fa-chevron-right');

                if (targetElement) {
                    if (!targetElement.style.maxHeight) {
                        targetElement.style.maxHeight = targetElement.scrollHeight + 'px';
                    }

                    const isHidden = targetElement.style.maxHeight === '0px';
                    targetElement.style.maxHeight = isHidden ? targetElement.scrollHeight + 'px' : '0px';
                    targetElement.style.overflow = 'hidden';  // Ensure content doesn't overflow

                    if (chevron) {
                        chevron.classList.toggle('fa-chevron-right', !isHidden);
                        chevron.classList.toggle('fa-chevron-down', isHidden);
                    }
                }
            };
        });

        const autoDetectButton = document.getElementById('autoDetectButton');
        autoDetectButton.addEventListener('click', () => {
            if (originalImageObject) {
                const imageWidth = originalImageObject.width;
                pixelWidthInput.value = imageWidth;
                pixelWidthSelector.value = imageWidth;
                console.log(`Detected image width: ${imageWidth}px`);

                if (autoPixelateEnabled) applyPixelation();
            } else {
                console.warn("No image detected. Please upload an image first.");
            }
        });



        let activeToggle = document.getElementById('palette-toggle');
        const autoPixelateToggle = document.getElementById('autoPixelateToggle');

        const toggles = document.querySelectorAll('.toggle-btn');

        autoPixelateToggle.classList.toggle('active', autoPixelateEnabled);
        autoPixelateToggle.setAttribute('aria-pressed', autoPixelateEnabled.toString());

        toggles.forEach(toggle => {
            toggle.addEventListener('click', function () {
                if (this.id === 'autoPixelateToggle') {
                    autoPixelateEnabled = !autoPixelateEnabled;
                    this.classList.toggle('active', autoPixelateEnabled);
                    this.setAttribute('aria-pressed', autoPixelateEnabled.toString());
                    return;
                }

                if (activeToggle !== this) {
                    toggles.forEach(btn => {
                        if (btn.id !== 'autoPixelateToggle') {
                            btn.classList.remove('active');
                            btn.setAttribute('aria-pressed', 'false');
                        }
                    });

                    this.classList.add('active');
                    this.setAttribute('aria-pressed', 'true');
                    activeToggle = this;
                } else {
                    this.classList.remove('active');
                    this.setAttribute('aria-pressed', 'false');
                    activeToggle = null;
                }
            });
        });

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const pixelateButton = document.getElementById('pixelateButton');
        const downloadFullButton = document.getElementById('downloadFull');
        const downloadPixelButton = document.getElementById('downloadPixel');
        const pixelWidthInput = document.getElementById('pixelWidthInput');
        const paletteNameInput = document.getElementById('paletteInput');
        const ditheringSelect = document.getElementById('dithering');
        const ditheringStrengthInput = document.getElementById('ditheringStrength');

        // Multi-image support elements
        const imageListPanel = document.getElementById('imageListPanel');
        const imageList = document.getElementById('imageList');
        const imageCountSpan = document.getElementById('imageCount');
        const processAllBtn = document.getElementById('processAllBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const canvasWrapper = document.querySelector('.canvas-wrapper');

        // Store multiple images
        let images = []; // Array of {id, file, name, originalImage, pixelatedCanvas, processed}
        let currentImageIndex = -1;

        pixelWidthSelector.addEventListener('change', () => {
            pixelWidthInput.value = pixelWidthSelector.value;
        });
        pixelWidthInput.addEventListener('input', () => {
            pixelWidthSelector.value = pixelWidthInput.value;
        });

        const paletteSelector = document.getElementById('paletteSelector');
        paletteSelector.addEventListener('change', () => {
            paletteNameInput.value = paletteSelector.value;
        });
        paletteNameInput.addEventListener('input', () => {
            paletteSelector.value = paletteNameInput.value;
        });

        let originalImageObject = null;
        let pixelatedCanvas = null;

        dropzone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (event) => {
            const files = Array.from(event.target.files);
            if (files.length) {
                addImages(files);
            }
            // Reset input to allow re-uploading same files
            fileInput.value = '';
        });

        dropzone.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropzone.style.borderColor = '#0084ff';
        });
        dropzone.addEventListener('dragleave', () => {
            dropzone.style.borderColor = '#cccccc';
        });
        dropzone.addEventListener('drop', (event) => {
            event.preventDefault();
            dropzone.style.borderColor = '#cccccc';
            const files = Array.from(event.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            if (files.length) {
                addImages(files);
            }
        });

        // Add multiple images to the list
        async function addImages(files) {
            const startOrder = images.length; // Remember starting position
            const filePromises = Array.from(files).map((file, index) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const image = new Image();
                        image.onload = function() {
                            const imageData = {
                                id: Date.now() + Math.random().toString(36).substr(2, 9),
                                file: file,
                                name: file.name,
                                originalImage: image,
                                pixelatedCanvas: null,
                                processed: false,
                                dataUrl: e.target.result,
                                order: startOrder + index // Keep original order
                            };
                            resolve(imageData);
                        };
                        image.onerror = reject;
                        image.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            });

            try {
                const loadedImages = await Promise.all(filePromises);
                images.push(...loadedImages);
                updateImageList();
                
                // Auto-select first image
                if (images.length === loadedImages.length) {
                    selectImage(0);
                }
            } catch (error) {
                console.error('Error loading images:', error);
                showToast('Error loading some images', 'error');
            }
        }

        // Update the image list UI
        function updateImageList() {
            imageCountSpan.textContent = images.length;
            
            if (images.length > 0) {
                imageListPanel.classList.add('active');
                canvasWrapper.classList.add('with-panel');
            } else {
                imageListPanel.classList.remove('active');
                canvasWrapper.classList.remove('with-panel');
                dropzone.classList.remove('active');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            imageList.innerHTML = '';
            images.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'image-item' + (index === currentImageIndex ? ' active' : '') + (img.processed ? ' processed' : '');
                item.innerHTML = `
                    <img src="${img.dataUrl}" alt="${img.name}">
                    <button class="remove-btn" data-index="${index}"><i class="fas fa-times"></i></button>
                    <div class="image-name">${img.name}</div>
                    ${img.processed ? '<div class="status-icon processed"><i class="fas fa-check"></i></div>' : ''}
                `;
                item.addEventListener('click', (e) => {
                    if (!e.target.closest('.remove-btn')) {
                        selectImage(index);
                    }
                });
                imageList.appendChild(item);
            });

            // Add remove button listeners
            document.querySelectorAll('.image-item .remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const index = parseInt(btn.dataset.index);
                    removeImage(index);
                });
            });
        }

        // Select an image to display
        function selectImage(index) {
            if (index < 0 || index >= images.length) return;
            
            currentImageIndex = index;
            const imgData = images[index];
            originalImageObject = imgData.originalImage;
            pixelatedCanvas = imgData.pixelatedCanvas;

            displayCurrentImage();
            updateImageList();
        }

        // Display the current image on canvas
        function displayCurrentImage() {
            if (!originalImageObject) return;
            
            const imageToShow = pixelatedCanvas || originalImageObject;
            
            const container = document.querySelector('.canvas-wrapper');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const imageAspectRatio = imageToShow.width / imageToShow.height;

            let canvasWidth, canvasHeight;

            if (containerWidth / containerHeight > imageAspectRatio) {
                canvasHeight = containerHeight;
                canvasWidth = canvasHeight * imageAspectRatio;
            } else {
                canvasWidth = containerWidth;
                canvasHeight = canvasWidth / imageAspectRatio;
            }

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            ctx.imageSmoothingEnabled = pixelatedCanvas ? false : true;
            canvas.style.imageRendering = pixelatedCanvas ? 'pixelated' : 'auto';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(
                imageToShow,
                0, 0, imageToShow.width, imageToShow.height,
                0, 0, canvas.width, canvas.height
            );
            canvas.style.display = 'block';
            dropzone.classList.add('active');
        }

        // Remove an image from the list
        function removeImage(index) {
            images.splice(index, 1);
            
            if (images.length === 0) {
                currentImageIndex = -1;
                originalImageObject = null;
                pixelatedCanvas = null;
            } else if (currentImageIndex >= images.length) {
                selectImage(images.length - 1);
            } else if (currentImageIndex === index) {
                selectImage(Math.min(index, images.length - 1));
            }
            
            updateImageList();
        }

        // Clear all images
        clearAllBtn.addEventListener('click', () => {
            images = [];
            currentImageIndex = -1;
            originalImageObject = null;
            pixelatedCanvas = null;
            updateImageList();
        });

        // Process all images
        processAllBtn.addEventListener('click', async () => {
            if (images.length === 0) {
                showToast('No images to process', 'error');
                return;
            }
            
            const startTime = Date.now();
            
            // Show progress overlay
            const overlay = document.createElement('div');
            overlay.className = 'progress-overlay';
            overlay.innerHTML = `
                <div class="progress-content">
                    <h3><i class="fas fa-magic"></i> Processing Images</h3>
                    <div class="progress-current-file">Preparing...</div>
                    <div class="progress-bar">
                        <div class="progress-percentage">0%</div>
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-stats">
                        <span><i class="fas fa-images"></i> <span class="progress-text">0 / ${images.length}</span></span>
                        <span><i class="fas fa-clock"></i> <span class="progress-time">--:--</span></span>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            
            const progressFill = overlay.querySelector('.progress-fill');
            const progressText = overlay.querySelector('.progress-text');
            const progressPercentage = overlay.querySelector('.progress-percentage');
            const progressCurrentFile = overlay.querySelector('.progress-current-file');
            const progressTime = overlay.querySelector('.progress-time');

            for (let i = 0; i < images.length; i++) {
                const img = images[i];
                
                // Update current file name
                progressCurrentFile.textContent = `Processing: ${img.name}`;
                
                // Update UI to show processing
                const item = imageList.children[i];
                if (item) {
                    const existingStatus = item.querySelector('.status-icon');
                    if (existingStatus) existingStatus.remove();
                    const processingIcon = document.createElement('div');
                    processingIcon.className = 'status-icon processing';
                    processingIcon.innerHTML = '<i class="fas fa-spinner"></i>';
                    item.appendChild(processingIcon);
                }

                await processImage(i);
                
                // Update progress
                const progress = ((i + 1) / images.length) * 100;
                progressFill.style.width = `${progress}%`;
                progressPercentage.textContent = `${Math.round(progress)}%`;
                progressText.textContent = `${i + 1} / ${images.length}`;
                
                // Calculate and display time
                const elapsedTime = Date.now() - startTime;
                const avgTimePerImage = elapsedTime / (i + 1);
                const remainingImages = images.length - (i + 1);
                const estimatedTimeLeft = avgTimePerImage * remainingImages;
                
                if (remainingImages > 0) {
                    const seconds = Math.ceil(estimatedTimeLeft / 1000);
                    const minutes = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    progressTime.textContent = `${minutes}:${secs.toString().padStart(2, '0')}`;
                } else {
                    progressTime.textContent = 'Done!';
                }
            }
            
            // Show completion message briefly
            progressCurrentFile.textContent = '✓ All images processed!';
            progressCurrentFile.style.color = '#4CAF50';
            
            // Remove overlay with animation
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 300);
            }, 1000);
            
            // Show the last processed image
            if (images.length > 0) {
                selectImage(currentImageIndex);
            }
            
            showToast(`Processed ${images.length} images`, 'success');
        });

        // Download all processed images as ZIP
        downloadAllBtn.addEventListener('click', async () => {
            const processedImages = images.filter(img => img.pixelatedCanvas);
            if (processedImages.length === 0) {
                showToast('No processed images to download', 'error');
                return;
            }

            downloadAllBtn.classList.add('loading');
            downloadAllBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            
            try {
                const zip = new JSZip();
                
                // Sort by original order
                const sortedImages = processedImages.sort((a, b) => a.order - b.order);
                
                for (let i = 0; i < sortedImages.length; i++) {
                    const img = sortedImages[i];
                    const paddedIndex = String(img.order + 1).padStart(4, '0');
                    const dataUrl = img.pixelatedCanvas.toDataURL('image/png');
                    const base64Data = dataUrl.split(',')[1];
                    zip.file(`${paddedIndex}.png`, base64Data, {base64: true});
                }

                const content = await zip.generateAsync({type: 'blob'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `pixelated-images-${Date.now()}.zip`;
                link.click();
                URL.revokeObjectURL(link.href);
                
                showToast(`Downloaded ${processedImages.length} images`, 'success');
            } catch (error) {
                console.error('Error creating zip:', error);
                showToast('Error creating zip file', 'error');
            } finally {
                downloadAllBtn.classList.remove('loading');
                downloadAllBtn.innerHTML = '<i class="fas fa-download"></i>';
            }
        });

        // Show toast notification
        function showToast(message, type = '') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Process a specific image by index
        async function processImage(index) {
            const imgData = images[index];
            if (!imgData) return;

            const pixelsWide = parseInt(pixelWidthInput.value) || 10;
            const paletteName = paletteNameInput.value.trim();
            const ditheringMethod = ditheringSelect.value;
            const ditheringStrength = parseInt(ditheringStrengthInput.value);

            let palette = null;
            if (paletteName) {
                palette = paletteName;
            }

            let paletteToUse = activePalette;

            if (activeToggle && activeToggle.id === 'lospec-toggle') {
                paletteToUse = palette;
            } else {
                paletteToUse = activePalette;
            }

            const options = {
                image: imgData.originalImage,
                width: pixelsWide,
                dither: ditheringMethod,
                strength: ditheringStrength,
                palette: paletteToUse,
                resolution: 'pixel',
            };

            try {
                canvas.classList.add('updating');
                const resultCanvas = await pixelate(options);
                imgData.pixelatedCanvas = resultCanvas;
                imgData.processed = true;
                
                // Update global state if this is the current image
                if (index === currentImageIndex) {
                    pixelatedCanvas = resultCanvas;
                    displayCurrentImage();
                }
                
                updateImageList();
                setTimeout(() => canvas.classList.remove('updating'), 100);
            } catch (error) {
                canvas.classList.remove('updating');
                console.error(`Error processing image ${imgData.name}:`, error);
            }
        }

        // Legacy function for backward compatibility
        function displayImage(file) {
            addImages([file]);
        }

        async function applyPixelation() {
            if (!originalImageObject || currentImageIndex < 0) return;
            await processImage(currentImageIndex);
        }

        pixelateButton.addEventListener('click', applyPixelation);
        pixelWidthInput.addEventListener('input', () => {
            if (autoPixelateEnabled) applyPixelation();
        });
        ditheringSelect.addEventListener('change', () => {
            if (autoPixelateEnabled) applyPixelation();
        });
        ditheringStrengthInput.addEventListener('input', () => {
            if (autoPixelateEnabled) applyPixelation();
        });
        paletteNameInput.addEventListener('input', () => {
            if (autoPixelateEnabled) applyPixelation();
        });
        paletteSelector.addEventListener('change', () => {
            if (autoPixelateEnabled) applyPixelation();
        });

        pixelWidthSelector.addEventListener('change', () => {
            if (autoPixelateEnabled) applyPixelation();
        });
        downloadPixelButton.addEventListener('click', () => {
            if (!pixelatedCanvas || currentImageIndex < 0) return;
            const imgData = images[currentImageIndex];
            const paddedIndex = String(imgData.order + 1).padStart(4, '0');
            const link = document.createElement('a');
            link.href = pixelatedCanvas.toDataURL('image/png');
            link.download = `${paddedIndex}.png`;
            link.click();
            showToast('Image downloaded', 'success');
        });

        downloadFullButton.addEventListener('click', async () => {
            if (!originalImageObject || currentImageIndex < 0) return;
            
            const imgData = images[currentImageIndex];
            const paddedIndex = String(imgData.order + 1).padStart(4, '0');
            const pixelsWide = parseInt(pixelWidthInput.value) || 10;
            const paletteName = paletteNameInput.value.trim();
            const ditheringMethod = ditheringSelect.value;
            const ditheringStrength = parseInt(ditheringStrengthInput.value);

            let palette = null;
            if (paletteName) {
                palette = paletteName;
            }

            let paletteToUse = activePalette;

            if (activeToggle && activeToggle.id === 'lospec-toggle') {
                paletteToUse = palette;
            } else {
                paletteToUse = activePalette;
            }
            const options = {
                image: originalImageObject,
                width: pixelsWide,
                dither: ditheringMethod,
                strength: ditheringStrength,
                palette: paletteToUse,
                resolution: 'original',
            };

            try {
                const fullCanvas = await pixelate(options);
                const link = document.createElement('a');
                link.href = fullCanvas.toDataURL('image/png');
                link.download = `${paddedIndex}.png`;
                link.click();
                showToast('Full resolution image downloaded', 'success');
            } catch (error) {
                console.error(error);
                showToast('Error downloading image', 'error');
            }
        });
  </script>
</body>

</html>
